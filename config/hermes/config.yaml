# ---------------------------------------------------------------------------
# 補助モデル（ビジョン・Web抽出・圧縮・セッション検索など）
# ---------------------------------------------------------------------------
# メインモデルが対応していない処理を委譲する。未設定時は auto で解決される。
# 環境変数参照: api_key: ${GOOGLE_API_KEY}

# auxiliary:
