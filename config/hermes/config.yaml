# ~/.hermes/config.yaml
# Hermes Agent 設定ファイル
# 参考: https://github.com/nousresearch/hermes-agent

# ---------------------------------------------------------------------------
# モデル設定
# ---------------------------------------------------------------------------
model:
  # デフォルトモデル
  # hermes config set model <provider>/<model> で変更可
  default: anthropic/claude-sonnet-4-6
  provider: anthropic

# ---------------------------------------------------------------------------
# カスタムプロバイダ
# ---------------------------------------------------------------------------
# OpenAI 互換 API を提供するローカルサーバーやサードパーティを追加する場合
# 使用方法: hermes config set model.provider custom:<name>

# custom_providers:
#   - name: ollama
#     base_url: http://127.0.0.1:11434/v1
#     api_mode: chat_completions
#
#   - name: llama
#     base_url: http://127.0.0.1:8080/v1
#     api_mode: chat_completions

# ---------------------------------------------------------------------------
# ツールセット
# ---------------------------------------------------------------------------
# toolsets:
#   - hermes-cli      # デフォルト。ファイル・シェル・Web ツール一式
#   - computer        # コンピュータ操作ツール（実験的）

# ---------------------------------------------------------------------------
# エージェント動作
# ---------------------------------------------------------------------------
agent:
  max_turns: 100       # ツール呼び出しの上限（暴走防止）
  # reasoning_effort: "medium"  # low | medium | high（対応モデルのみ）
  # verbose: false
  # tool_use_enforcement: auto   # auto | strict | disabled
  # image_input_mode: auto       # auto | always | never

# ---------------------------------------------------------------------------
# ターミナル / サンドボックス
# ---------------------------------------------------------------------------
terminal:
  # "local" | "docker" | "ssh" | "modal" | "daytona" | "vercel_sandbox" | "singularity" | "disabled"
  backend: local
  # timeout: 120           # コマンドタイムアウト秒数
  # cwd: "~"               # デフォルト作業ディレクトリ
  # file_sync_max_mb: 10   # Docker バックエンド使用時のファイル同期上限 (MB)

  # Docker バックエンド設定例
  # backend: docker
  # docker_image: "nikolaik/python-nodejs:python3.11-nodejs20"
  # container_memory: 5120   # MB
  # docker_volumes:
  #   - "/home/user/projects:/workspace/projects"

# ---------------------------------------------------------------------------
# セッション自動リセット
# ---------------------------------------------------------------------------
# session_reset:
#   mode: "idle"         # "idle" = 非アクティブ後に新規セッション開始
#   idle_minutes: 60

# ---------------------------------------------------------------------------
# コンテキスト圧縮
# ---------------------------------------------------------------------------
compression:
  enabled: true
  threshold: 0.50      # コンテキスト使用率がこの値を超えたら圧縮
  # target_ratio: 0.20  # 圧縮後に保持する最新メッセージ比率
  # protect_last_n: 20  # 圧縮対象外にする最新メッセージ数

# ---------------------------------------------------------------------------
# メモリ
# ---------------------------------------------------------------------------
# Hermes の主要機能。セッションをまたいだ記憶と学習を制御する。
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200   # ~800 tokens
  user_char_limit: 1375     # ~500 tokens
  # provider: openviking  # honcho | mem0 | hindsight | holographic | retaindb | byterover | supermemory
  # BRV_API_KEY 等プロバイダ固有のキーは ~/.hermes/.env に設定する

# ---------------------------------------------------------------------------
# 表示設定
# ---------------------------------------------------------------------------
display:
  tool_progress: all     # off | new | all | verbose
  streaming: true        # トークンのリアルタイム表示
  show_cost: false       # 推定コスト表示
  # show_reasoning: false       # 推論過程の表示
  # runtime_footer: true        # ターン終了時にモデル・コスト・トークン数を表示
  # file_mutation_verifier: true  # ファイル変更後に内容を検証

# ---------------------------------------------------------------------------
# ツール出力制限
# ---------------------------------------------------------------------------
# tool_output:
#   max_bytes: 50000       # ターミナル出力の上限バイト数
#   max_lines: 2000        # ファイル読み取りのページネーション行数
#   max_line_length: 2000  # 1行の最大文字数

# ---------------------------------------------------------------------------
# ツールループ暴走防止
# ---------------------------------------------------------------------------
# tool_loop_guardrails:
#   warnings_enabled: true
#   hard_stop_enabled: false
#   warn_after:
#     exact_failure: 2          # 同一ツール・同一引数の連続失敗
#     same_tool_failure: 3      # 同一ツールの連続失敗
#     idempotent_no_progress: 2 # 冪等ツールで進捗なし
#   hard_stop_after:
#     exact_failure: 5
#     same_tool_failure: 8
#     idempotent_no_progress: 5

# ---------------------------------------------------------------------------
# プロンプトキャッシュ
# ---------------------------------------------------------------------------
# prompt_caching:
#   cache_ttl: 5m              # キャッシュ有効期間（5分 or 1時間）

# ---------------------------------------------------------------------------
# スキル設定
# ---------------------------------------------------------------------------
# skills:
#   external_dirs: []          # 外部スキルディレクトリ（絶対パス）
#   template_vars: true        # スキル内の {{変数}} 展開を有効化
#   inline_shell: false        # スキル内シェルスクリプト実行（セキュリティ注意）
#   guard_agent_created: false # エージェントが作成したスキルを保護

# ---------------------------------------------------------------------------
# スキルキュレーター（定期的な整理・アーカイブ）
# ---------------------------------------------------------------------------
# curator:
#   enabled: true
#   interval_hours: 168        # 実行間隔（デフォルト: 1週間）
#   min_idle_hours: 2          # 最終使用からの最小経過時間
#   stale_after_days: 30       # 古いと判定する日数
#   archive_after_days: 90     # アーカイブする日数
#   backup:
#     enabled: true
#     keep: 5                  # バックアップ保持数

# ---------------------------------------------------------------------------
# 目標モード（goals）
# ---------------------------------------------------------------------------
# goals:
#   max_turns: 20              # 目標達成モードのターン上限

# ---------------------------------------------------------------------------
# セキュリティ
# ---------------------------------------------------------------------------
security:
  redact_secrets: true   # APIキーパターンをログからマスク
  # tirith_enabled: true   # 実行前セキュリティスキャン
  # privacy:
  #   redact_pii: true     # 個人情報をログからマスク

# ---------------------------------------------------------------------------
# 承認モード（危険なコマンドの処理方法）
# ---------------------------------------------------------------------------
# approvals:
#   mode: "ask"          # "ask" | "auto" | "skip"（本番環境では "ask" 推奨）

# ---------------------------------------------------------------------------
# タイムゾーン
# ---------------------------------------------------------------------------
# timezone: "Asia/Tokyo"

# ---------------------------------------------------------------------------
# ファイル読み取り上限
# ---------------------------------------------------------------------------
# file_read_max_chars: 100000   # 1ファイルあたりの最大文字数

# ---------------------------------------------------------------------------
# コード実行モード
# ---------------------------------------------------------------------------
# code_execution:
#   mode: "sandbox"      # "sandbox" | "local" | "disabled"

# ---------------------------------------------------------------------------
# チェックポイント（ファイルシステムスナップショット）
# ---------------------------------------------------------------------------
# checkpoints:
#   enabled: false       # ファイル変更前にスナップショットを取得

# ---------------------------------------------------------------------------
# Webバックエンド（検索エンジン選択）
# ---------------------------------------------------------------------------
# web:
#   backend: "auto"      # "auto" | "brave" | "serper" | "tavily" | "duckduckgo"
#   # BRAVE_API_KEY, SERPER_API_KEY, TAVILY_API_KEY 等を .env に設定

# ---------------------------------------------------------------------------
# ブラウザ自動化
# ---------------------------------------------------------------------------
# browser:
#   backend: "auto"      # "auto" | "playwright" | "puppeteer" | "disabled"

# ---------------------------------------------------------------------------
# TTS（音声合成）
# ---------------------------------------------------------------------------
# tts:
#   provider: "auto"     # "auto" | "elevenlabs" | "openai" | "disabled"
#   # voice: "Rachel"    # ElevenLabs ボイスID / OpenAI ボイス名

# ---------------------------------------------------------------------------
# STT（音声認識）
# ---------------------------------------------------------------------------
# stt:
#   backend: "auto"      # "auto" | "openai" | "disabled"

# ---------------------------------------------------------------------------
# 音声モード（CLIマイクモード）
# ---------------------------------------------------------------------------
# voice:
#   enabled: false       # --voice フラグで起動するマイク入力モード

# ---------------------------------------------------------------------------
# クイックコマンド（カスタムスラッシュコマンド）
# ---------------------------------------------------------------------------
# quick_commands:
#   - name: "review"
#     description: "コードレビューを実行"
#     prompt: "このコードをレビューして、問題点を日本語で指摘してください"
#   - name: "commit"
#     description: "git コミットメッセージを生成"
#     prompt: "git diff を確認して、適切なコミットメッセージを提案してください"

# ---------------------------------------------------------------------------
# Gitワークツリー（変更の分離）
# ---------------------------------------------------------------------------
# worktree:
#   enabled: false       # 変更を一時 worktree に分離して安全に適用

# ---------------------------------------------------------------------------
# コンテキストエンジン（圧縮プラグイン）
# ---------------------------------------------------------------------------
# context:
#   engine: "default"    # "default" | カスタムプラグイン名

# ---------------------------------------------------------------------------
# APIキーローテーション
# ---------------------------------------------------------------------------
# credential_pool_strategies:
#   - provider: anthropic
#     keys:
#       - ${ANTHROPIC_API_KEY_1}
#       - ${ANTHROPIC_API_KEY_2}
#     strategy: "round_robin"   # "round_robin" | "fallback"

# ---------------------------------------------------------------------------
# 補助モデル（ビジョン・Web抽出・圧縮・セッション検索など）
# ---------------------------------------------------------------------------
# メインモデルが対応していない処理を委譲する。未設定時は auto で解決される。
# 環境変数参照: api_key: ${GOOGLE_API_KEY}

# auxiliary:
#   vision:
#     provider: auto
#     model: ""              # e.g. "google/gemini-2.5-flash"
#     timeout: 120           # 画像ダウンロード込みで余裕を持たせる
#     download_timeout: 30
#
#   web_extract:
#     provider: auto
#     model: ""
#     timeout: 360           # Webページ要約は時間がかかる
#
#   compression:
#     timeout: 120           # 長い会話の圧縮
#
#   session_search:
#     provider: auto
#     model: ""
#     timeout: 30
#     max_concurrency: 3     # 429 抑制
#
#   triage_specifier:
#     provider: auto
#     model: ""              # 安価・高速モデルで十分
#     timeout: 120

# ---------------------------------------------------------------------------
# マルチエージェント委任
# ---------------------------------------------------------------------------
# delegation:
#   max_iterations: 50             # 子エージェントあたりの最大ターン数
#   max_concurrent_children: 3     # 並列実行数
#   max_spawn_depth: 1             # ネスト深度（1=フラット、最大3）
#   orchestrator_enabled: true
#   model: ""                      # 委任先モデルを変えたい場合
#   provider: ""

