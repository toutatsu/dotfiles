# Deep Agents CLI 設定ファイル
# 詳細: https://docs.langchain.com/oss/python/deepagents/cli/overview

[models]
# デフォルトモデル（起動時に使用される）
default = "openai:unsloth/Qwen3.6-35B-A3B-GGUF:Q4_K_M"

# シェルコマンドの許可リスト
# "recommended": 安全なデフォルトセット（git, grep, find など）
# "all": すべて許可 / カンマ区切りで個別指定も可
shell_allow_list = "recommended"


# --- プロバイダー設定 ---
# https://github.com/langchain-ai/deepagents/pull/1127 Compatible APIs を参考

[models.providers.openai]
base_url = "http://192.168.1.123:11446/v1"
api_key_env = "OPENAI_API_KEY"
models = ["unsloth/Qwen3.6-35B-A3B-GGUF:Q4_K_M"]
