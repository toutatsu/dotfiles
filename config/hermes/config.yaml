#     timeout: 120

# ---------------------------------------------------------------------------
# マルチエージェント委任
# ---------------------------------------------------------------------------
# delegation:
#   max_iterations: 50             # 子エージェントあたりの最大ターン数
#   max_concurrent_children: 3     # 並列実行数
#   max_spawn_depth: 1             # ネスト深度（1=フラット、最大3）
#   orchestrator_enabled: true
