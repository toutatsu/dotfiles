# Termux configuration
# https://wiki.termux.com/wiki/Terminal_Settings

# Extra keys row (displayed above the keyboard)
extra-keys = [ \
  ['ESC', 'TAB', 'CTRL', 'ALT', '/', '-', '_', '|'], \
  ['UP', 'DOWN', 'LEFT', 'RIGHT', 'HOME', 'END', 'BKSP', 'DEL'] \
]

# Back key behavior: 'back' (default) or 'escape'
back-key = escape

# Bell character: 'vibrate' (default), 'beep', or 'ignore'
bell-character = vibrate

# Cursor style: 'block' (default), 'underline', or 'bar'
terminal-cursor-style = bar
